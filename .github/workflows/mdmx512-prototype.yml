name: mdmx512-prototype

on:
  push:
    paths:
      - 'prototype/mdmx512/**'
      - '.github/workflows/mdmx512-prototype.yml'
  pull_request:
    paths:
      - 'prototype/mdmx512/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run MDMX512 prototype tests
        working-directory: prototype/mdmx512
        run: python -m unittest -v test_protocol.py
