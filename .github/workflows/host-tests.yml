name: host-tests

on:
  push:
    paths:
      - 'host/**'
      - 'tools/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'host/**'
      - 'tools/**'

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protocol unit tests
        run: python -m unittest discover -s host/tests -v
      - name: Generate development fixtures
        run: python tools/generate_dev_fixtures.py
